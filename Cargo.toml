[package]
name = "desync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
ciborium = "0.2.2"
ed25519-dalek = { version = "2.2", features = ["rand_core","serde"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rand = "0.8.5"
serde = {version = "1.0.228", features = ["derive"]}
serde-big-array = "0.5"
vdf = "0.1.0"
blake3 = "1.8.3"
futures = "0.3.31"
libp2p = { version = "0.53", features = ["tcp", "tokio", "noise", "yamux", "gossipsub", "request-response", "macros", "cbor"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
hex = "0.4.3"

